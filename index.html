<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14161a" />
  <title>Kartenwert</title>
  <meta name="description" content="Pokémon-Karten im Laden bewerten: TCGdex-Preise, Angebote, Ankaufsleiter, Bestand." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <button id="nav-back" class="nav-back hidden" aria-label="Zurück">‹</button>
    <h1>Kartenwert</h1>
    <span id="net-status" class="net" aria-live="polite"></span>
  </header>

  <main>
    <!-- SUCHE -->
    <section id="view-search" class="view active" aria-label="Suche">
      <h2 class="page-title">Suchen</h2>
      <div class="card">
        <label class="row">
          <span>Sprache</span>
          <select id="search-lang"></select>
        </label>
        <div class="seg" role="tablist" id="search-mode">
          <button data-mode="name" class="on" role="tab">Name</button>
          <button data-mode="number" role="tab">Nummer</button>
          <button data-mode="camera" role="tab">Kamera</button>
        </div>

        <form id="form-name" class="mode-pane" data-pane="name">
          <div class="inline">
            <input id="q-name" type="search" placeholder="z. B. Glurak" autocomplete="off" enterkeyhint="search" />
            <button class="primary" type="submit">Suchen</button>
          </div>
        </form>

        <form id="form-number" class="mode-pane hidden" data-pane="number">
          <div class="inline">
            <input id="q-num" inputmode="text" placeholder="Nr. z. B. 97" autocomplete="off" />
            <span class="slash">/</span>
            <input id="q-total" inputmode="text" placeholder="Gesamt z. B. 99" autocomplete="off" />
            <button class="primary" type="submit">Suchen</button>
          </div>
          <p class="hint">Nummer unten auf der Karte, z.&nbsp;B. 97/99.</p>
        </form>

        <div class="mode-pane hidden" data-pane="camera">
          <button id="scan-start" class="primary block">Live-Scanner starten</button>
          <div id="scan-live" class="hidden">
            <div class="scan-wrap" id="scan-wrap">
              <video id="scan-video" playsinline muted autoplay></video>
              <div class="scan-frame" id="scan-frame"><div class="scan-strip"><span>Nummer</span></div></div>
            </div>
            <p id="scan-status" class="status" aria-live="polite"></p>
            <div class="grid2">
              <button id="scan-torch" class="hidden">Licht</button>
              <button id="scan-stop">Scanner beenden</button>
            </div>
          </div>
          <div class="grid2" style="margin-top:10px">
            <label class="btn file-btn">Foto aufnehmen<input id="cam-input" type="file" accept="image/*" capture="environment" hidden /></label>
            <label class="btn file-btn">Aus Galerie<input id="gal-input" type="file" accept="image/*" hidden /></label>
          </div>
          <p class="hint">Live-Scanner: Karte in den Rahmen halten, die Nummer wird automatisch gelesen, sobald das Bild scharf ist.</p>
          <div id="crop-wrap" class="hidden">
            <p class="hint">Rechteck um die Kartennummer ziehen.</p>
            <div class="crop-presets">
              <button data-preset="bl">unten links</button>
              <button data-preset="b">ganze Unterkante</button>
              <button data-preset="br">unten rechts</button>
            </div>
            <canvas id="crop-canvas"></canvas>
            <button id="crop-ok" class="primary block">Nummer lesen</button>
          </div>
          <div id="ocr-result" class="hidden"></div>
        </div>
      </div>

      <div id="search-status" class="status" aria-live="polite"></div>
      <div id="results" class="results"></div>
    </section>

    <!-- BEWERTEN -->
    <section id="view-eval" class="view" aria-label="Bewerten">
      <h2 class="page-title">Bewerten</h2>
      <div id="eval-empty" class="empty">Keine Karte ausgewählt.</div>
      <div id="eval"></div>
    </section>

    <!-- GRADING -->
    <section id="view-grade" class="view" aria-label="Grading">
      <h2 class="page-title">Grading-Check</h2>
      <div id="grade"></div>
    </section>

    <!-- BESTAND -->
    <section id="view-inv" class="view" aria-label="Sammlung">
      <h2 class="page-title">Sammlung</h2>
      <div id="inv"></div>
    </section>

    <!-- EINSTELLUNGEN -->
    <section id="view-settings" class="view" aria-label="Einstellungen">
      <h2 class="page-title">Einstellungen</h2>
      <div id="settings"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="search" class="on">Suchen</button>
    <button data-view="eval">Bewerten</button>
    <button data-view="grade">Grading</button>
    <button data-view="inv">Sammlung</button>
    <button data-view="settings">Optionen</button>
  </nav>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
